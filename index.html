    <style>
        :root {
            --red: #DA291C;
            --yellow: #FFCC00;
            --black: #1C1C1C;
        }
        * { box-sizing: border-box; }
        body {
            background: #f4f4f4;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 10px 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #wrapper {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border: 6px solid var(--red);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }
        #header {
            background: linear-gradient(to right, var(--red), #b71c1c);
            color: white;
            padding: 14px 0 10px;
            text-align: center;
        }
        h1 {
            font-size: 2.65em;
            margin: 0;
            letter-spacing: -1.5px;
        }
        h2 {
            color: var(--yellow);
            margin: 4px 0 0;
            font-size: 1.02em;
        }
        #content {
            padding: 18px 15px 15px;
            text-align: center;
        }
        #dia-topo {
            font-size: 1.45em;
            color: var(--red);
            margin-bottom: 8px;
        }
        #relogio {
            font-size: 6.8em;
            font-weight: bold;
            line-height: 1;
            color: var(--black);
            margin: 5px 0 12px;
            text-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        #automatico {
            color: #444;
            font-size: 1.02em;
            margin: 8px 0 15px;
        }
        .doe {
            background: #f9f9f9;
            border-top: 1px solid #eee;
            padding: 14px 15px;
            font-size: 1.02em;
        }
        #footer2 {
            background: var(--black);
            color: #ddd;
            padding: 12px 15px;
            text-align: center;
            font-size: 0.9em;
        }
        #footer2 img {
            vertical-align: middle;
            margin-right: 7px;
        }
        @media (max-width: 480px) {
            h1 { font-size: 2.35em; }
            #relogio { font-size: 5.6em; }
            #dia-topo { font-size: 1.35em; }
        }
    </style>

<body>

<div id="wrapper">
    <div id="header">
        <h1>Horário de Angola</h1>
        <h2>A hora oficial de Angola (UTC+1)</h2>
    </div>
  
    <div id="content">
        <h3 id="dia-topo">Carregando...</h3>
        <p id="relogio">00:00:00</p>
        <p id="automatico">A hora certa é sincronizada automaticamente.<br>Não é necessário recarregar a página.</p>
    </div>
    
    <div class="doe">
        <p>
            Acerte seu <strong>RELÓGIO</strong> com a hora oficial de Angola.<br><br>
        </p>
    </div>

    <div id="footer2">
        <p>
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/9d/Flag_of_Angola.svg/20px-Flag_of_Angola.svg.png"
                 width="26" height="17" alt="Bandeira de Angola">
            Angola (UTC+1) — Horário Oficial • <span id="dia-rodape">Carregando...</span>
        </p>
        <p style="margin-top:5px; opacity:0.9;">© 2026 Horário de Angola</p>
    </div>
</div>

<script>
function atualizarHorarioAngola() {
    const optionsHora = { timeZone: "Africa/Luanda", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false };
    const optionsData = { timeZone: "Africa/Luanda", weekday: "long", day: "numeric", month: "long", year: "numeric" };
   
    const agora = new Date();
    document.getElementById('relogio').textContent = new Intl.DateTimeFormat('pt-BR', optionsHora).format(agora);
    
    let dataFormatada = new Intl.DateTimeFormat('pt-BR', optionsData).format(agora);
    dataFormatada = dataFormatada.charAt(0).toUpperCase() + dataFormatada.slice(1);
   
    document.getElementById('dia-topo').textContent = dataFormatada;
    document.getElementById('dia-rodape').textContent = dataFormatada;
}
atualizarHorarioAngola();
setInterval(atualizarHorarioAngola, 1000);
</script>
</body>
